name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --all --verbose

  estilo:
    name: fmt + clippy
    runs-on: ubuntu-latest
    # Bloqueante: el codigo ya esta formateado con rustfmt, asi que este job
    # debe pasar. Si falla, es que alguien subio codigo sin pasar `cargo fmt`.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings

  build:
    name: binario (${{ matrix.nombre }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            nombre: windows-x86_64
            bin: reaction-lab.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            nombre: linux-x86_64
            bin: reaction-lab
          - os: macos-latest
            target: aarch64-apple-darwin
            nombre: macos-arm64
            bin: reaction-lab
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Compilar release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Humo — flujo completo con el binario real
        shell: bash
        run: |
          set -e
          B="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          "$B" --version
          "$B" sellar --sujeto test --autor CI -o pr.txt
          "$B" verificar pr.txt
          "$B" plantilla -o plantilla.csv
          "$B" demo --perfil script -o datos.csv > /dev/null
          "$B" analizar --csv datos.csv --sujeto kai --preregistro pr.txt -o informe.html
          test -s informe.html
          # el sello manipulado DEBE hacer fallar el analisis
          sed 's/z_max=-1.000000/z_max=-0.100000/' pr.txt > malo.txt
          if "$B" verificar malo.txt; then
            echo "FALLO: acepto un sello manipulado"; exit 1
          fi
          echo "humo OK"

      - name: Empaquetar
        shell: bash
        run: |
          mkdir -p release
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" release/
          cp README.md LICENSE release/
          cp -r ejemplos release/
          tar -czf "reaction-lab-${{ matrix.nombre }}.tar.gz" -C release .

      - uses: actions/upload-artifact@v4
        with:
          name: reaction-lab-${{ matrix.nombre }}
          path: reaction-lab-${{ matrix.nombre }}.tar.gz
          retention-days: 90

      - name: Adjuntar a la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: reaction-lab-${{ matrix.nombre }}.tar.gz
          generate_release_notes: true
