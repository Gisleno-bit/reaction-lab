[package]
name = "reaction-lab"
version = "0.4.0"
edition = "2021"
rust-version = "1.70"
description = "Analisis de tiempos de reaccion en juegos de lucha por comparacion contra un baseline"
license = "MIT"
readme = "README.md"
repository = "https://github.com/USUARIO/reaction-lab"
keywords = ["fgc", "frame-data", "estadistica"]
categories = ["command-line-utilities"]

[lib]
name = "reaction_lab"
path = "src/lib.rs"

[[bin]]
name = "reaction-lab"
path = "src/main.rs"

# Cero dependencias, a proposito: el build no puede romperse por un crate
# ajeno, el binario sale pequeno y todo el calculo es auditable aqui dentro.
[dependencies]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
